<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Tienda</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<header class="header-brand text-white sticky top-0 z-40 shadow-lg">
  <div class="max-w-6xl mx-auto flex items-center justify-between gap-2 p-3 flex-wrap">
    <h1 id="site-title" class="text-lg font-black">Mi Tienda</h1>
    <nav class="flex items-center gap-1 text-sm flex-wrap">
      <button onclick="mostrarTab('tienda')" class="px-3 py-2 rounded-lg hover:bg-black/20">Tienda</button>
      <button onclick="mostrarTab('ventas')" class="px-3 py-2 rounded-lg hover:bg-black/20">Ventas</button>
      <button onclick="mostrarTab('config')" class="px-3 py-2 rounded-lg hover:bg-black/20">Configuración</button>
      <button onclick="abrirModal('modal-carrito')" class="px-3 py-2 rounded-lg bg-black/20">🛒 <span id="cart-count" class="font-bold">0</span></button>
      <button id="auth-btn" onclick="authAction()" class="px-3 py-2 rounded-lg btn-primary text-slate-900 font-bold">Ingresar</button>
    </nav>
  </div>
</header>

<div class="max-w-6xl mx-auto p-4">
  <!-- TIENDA -->
  <section id="tab-tienda">
    <div class="header-brand text-white rounded-2xl p-6 sm:p-10 mb-6">
      <h2 id="hero-title" class="text-2xl sm:text-4xl font-black">Mi Tienda</h2>
      <p id="hero-sub" class="text-slate-300 mt-1">Compra fácil y rápido</p>
      <p class="text-sm mt-3">📞 <span id="hero-tel"></span></p>
    </div>
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
  </section>

  <!-- VENTAS -->
  <section id="tab-ventas" class="hidden">
    <h2 class="text-2xl font-black mb-4">Ventas y Reportes</h2>
    <div id="ventas-resumen" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6"></div>
    <div id="ventas-lista"></div>
  </section>

  <!-- CONFIG -->
  <section id="tab-config" class="hidden">
    <h2 class="text-2xl font-black mb-4">Configuración del sitio</h2>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white p-4 rounded-2xl shadow">
        <h3 class="font-bold mb-3">✏️ Textos e imágenes del sitio</h3>
        <label class="text-xs font-bold text-slate-500">Título</label>
        <input id="c-titulo" class="w-full border rounded-lg p-2 mb-2">
        <label class="text-xs font-bold text-slate-500">Subtítulo</label>
        <input id="c-sub" class="w-full border rounded-lg p-2 mb-2">
        <label class="text-xs font-bold text-slate-500">Teléfono</label>
        <input id="c-tel" class="w-full border rounded-lg p-2 mb-2">
        <label class="text-xs font-bold text-slate-500">Color principal</label>
        <input id="c-color" type="color" class="w-full h-10 border rounded-lg p-1 mb-2">
        <label class="text-xs font-bold text-slate-500">URL de tu QR de pago (Yape/Plin)</label>
        <input id="c-qr" placeholder="https://... (vacío = QR automático)" class="w-full border rounded-lg p-2 mb-3">
        <button onclick="guardarConfigSite()" class="w-full btn-primary text-white font-bold py-2 rounded-lg">Guardar cambios</button>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow">
        <h3 class="font-bold mb-3" id="form-titulo">➕ Agregar producto</h3>
        <input id="f-nombre" placeholder="Nombre del producto" class="w-full border rounded-lg p-2 mb-2">
        <input id="f-desc" placeholder="Descripción" class="w-full border rounded-lg p-2 mb-2">
        <input id="f-img" placeholder="URL de la imagen" class="w-full border rounded-lg p-2 mb-2">
        <div class="grid grid-cols-3 gap-2 mb-2">
          <div><label class="text-xs font-bold text-slate-500">P. compra</label><input id="f-compra" type="number" step="0.01" class="w-full border rounded-lg p-2"></div>
          <div><label class="text-xs font-bold text-slate-500">P. venta</label><input id="f-venta" type="number" step="0.01" class="w-full border rounded-lg p-2"></div>
          <div><label class="text-xs font-bold text-slate-500">Stock</label><input id="f-stock" type="number" class="w-full border rounded-lg p-2"></div>
        </div>
        <div class="flex gap-2">
          <button onclick="guardarProductoForm()" class="flex-1 btn-primary text-white font-bold py-2 rounded-lg">Guardar producto</button>
          <button onclick="limpiarFormulario()" class="bg-slate-200 px-3 rounded-lg">Limpiar</button>
        </div>
      </div>
    </div>
    <h3 class="font-bold mt-8 mb-3">📦 Productos existentes</h3>
    <div id="config-lista"></div>
  </section>
</div>

<!-- MODAL CARRITO -->
<div id="modal-carrito" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-md w-full p-5">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-xl font-black">🛒 Carrito</h3>
      <button onclick="cerrarModal('modal-carrito')" class="text-slate-400 text-xl">✕</button>
    </div>
    <div id="cart-items" class="max-h-64 overflow-auto"></div>
    <div class="flex justify-between items-center mt-4 border-t pt-3">
      <span class="font-bold">Total:</span>
      <span id="cart-total" class="text-xl font-black text-cyan-600">S/ 0.00</span>
    </div>
    <button onclick="abrirPago()" class="w-full mt-4 bg-emerald-500 text-white font-bold py-3 rounded-xl">Pagar con QR</button>
  </div>
</div>

<!-- MODAL PAGO -->
<div id="modal-pago" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center">
    <h3 class="text-xl font-black mb-1">Pago con QR</h3>
    <p class="text-xs text-slate-500 mb-3">Escanea y paga el monto exacto</p>
    <img id="pago-qr" class="mx-auto rounded-xl border" width="220" height="220" alt="QR de pago">
    <p class="mt-3 text-sm">Monto: <b id="pago-monto" class="text-cyan-600 text-lg"></b></p>
    <p class="text-xs text-slate-500">Código: <b id="pago-codigo"></b></p>
    <div class="flex gap-2 mt-4">
      <button onclick="cerrarModal('modal-pago')" class="flex-1 bg-slate-200 py-2 rounded-lg font-bold">Cancelar</button>
      <button onclick="confirmarPago()" class="flex-1 bg-emerald-500 text-white py-2 rounded-lg font-bold">Ya pagué</button>
    </div>
  </div>
</div>

<!-- MODAL LOGIN -->
<div id="modal-login" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-sm w-full p-6">
    <h3 class="text-xl font-black mb-1">🔒 Ingresar</h3>
    <p id="login-hint" class="text-xs text-slate-500 mb-3"></p>
    <input id="login-email" type="email" placeholder="Correo (solo si usas Supabase)" class="w-full border rounded-lg p-2 mb-2">
    <input id="login-pass" type="password" placeholder="Contraseña" class="w-full border rounded-lg p-2 mb-3" onkeydown="if(event.key==='Enter') login()">
    <button onclick="login()" class="w-full btn-primary text-white font-bold py-2 rounded-xl">Entrar</button>
  </div>
</div>

<!-- Librerías + scripts en orden -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/ventas.js"></script>
<script src="js/config-site.js"></script>
<script src="js/app.js"></script>
</body>
</html>
